services:
  - type: web
    name: election-campaign-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: election-campaign-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false

databases:
  - name: election-campaign-db
    databaseName: election_campaign
    user: election_campaign
    plan: free
