<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="Please vote for our candidate for a better future.">
    <title>Vote for a Better Future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Campaign home">
        <span class="party-mark" aria-hidden="true">
          <span class="party-mark-fallback">P</span>
          <img class="hidden" src="images/party-logo.png" alt="">
        </span>
        <span>OUR CANDIDATE</span>
      </a>
      <a class="problems-link" href="local-problems.html">Share a local problem <span aria-hidden="true">→</span></a>
    </header>

    <main>
      <section class="campaign">
        <div class="campaign-message">
          <p class="eyebrow">Your Vote. Our future.</p>
          <h1>Please vote for our candidate for a <em>better future.</em></h1>
          <a class="problems-button" href="local-problems.html">Tell us about a local problem <span aria-hidden="true">→</span></a>
        </div>
        <div class="candidate-image">
          <div class="candidate-placeholder" id="candidate-photo-placeholder" aria-hidden="true">Candidate photo</div>
          <img class="candidate-photo hidden" src="images/candidate-photo.jpg" alt="Candidate">
        </div>
      </section>

    </main>
    <script src="app.js"></script>
  </body>
</html>
