<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="Share a local problem with the campaign.">
    <title>Share a Local Problem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Campaign home">
        <span class="party-mark" aria-hidden="true">
          <span class="party-mark-fallback">P</span>
          <img class="hidden" src="images/party-logo.png" alt="">
        </span>
        <span>OUR CANDIDATE</span>
      </a>
      <a class="problems-link" href="index.html">← Back to campaign</a>
    </header>

    <main class="problems-page">
      <h1>Tell us about a <em>local problem.</em></h1>
      <p class="page-intro">What needs attention in your community?</p>
      <div class="problems-layout">
        <form class="problem-form" id="problem-form">
          <label for="problem-title">Problem</label>
          <input id="problem-title" name="title" type="text" maxlength="100" required placeholder="Briefly describe the issue">

          <label for="problem-category">Category</label>
          <select id="problem-category" name="category" required>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Housing">Housing</option>
            <option value="Public safety">Public safety</option>
            <option value="Environment">Environment</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Transport">Transport</option>
            <option value="Other">Other</option>
          </select>

          <label for="problem-division">Division</label>
          <input id="problem-division" name="division" type="text" maxlength="100" required placeholder="Enter your division">

          <label for="problem-location">Neighborhood or street <span>(optional)</span></label>
          <input id="problem-location" name="location" type="text" maxlength="100" placeholder="Add a specific location">

          <label for="problem-mobile">Mobile number <span>(optional)</span></label>
          <input id="problem-mobile" name="mobileNumber" type="tel" maxlength="32" autocomplete="tel" placeholder="For follow-up">

          <label for="problem-email">Email <span>(optional)</span></label>
          <input id="problem-email" name="emailAddress" type="email" maxlength="254" autocomplete="email" placeholder="For follow-up">

          <label for="problem-description">Details</label>
          <textarea id="problem-description" name="description" maxlength="1000" required placeholder="How does this affect your community?"></textarea>

          <button class="problems-button" type="submit">Save problem <span aria-hidden="true">→</span></button>
          <p class="problem-privacy">Problems are stored in the shared database. Any mobile number or email you provide will be visible to all visitors.</p>
          <p class="problem-status" id="problem-status" role="status" aria-live="polite"></p>
        </form>

        <section class="problem-list-panel" aria-labelledby="saved-problems-title">
          <div class="problem-list-heading">
            <h2 id="saved-problems-title">Track local problems</h2>
            <span class="problem-count" id="problem-count">0</span>
          </div>
          <div class="admin-login">
            <p class="admin-login-description">Only admins can edit, assign, or delete reports.</p>
            <button class="admin-login-button" id="admin-sign-in" type="button">Admin sign in</button>
            <p class="problem-status" id="admin-status" role="status" aria-live="polite"></p>
          </div>
          <div class="problem-filters">
            <label>
              Division
              <select id="division-filter">
                <option value="">All divisions</option>
              </select>
            </label>
            <label>
              Status
              <select id="status-filter">
                <option value="">All statuses</option>
                <option value="Open">Open</option>
                <option value="In progress">In progress</option>
                <option value="Resolved">Resolved</option>
              </select>
            </label>
          </div>
          <div class="problem-list" id="problem-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="local-problems.js"></script>
  </body>
</html>
